<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NoiseBreakout">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D111D" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>NoiseBreakout</title>
<style>
/* Layout: one phone-width column, sticky status header, four tabs fixed at the bottom. */
:root {
  --bg: #F3F5F9; --surface: #FFFFFF; --sunken: #E9EDF4; --ink: #0F1524; --muted: #5A6477;
  --line: #DDE2EB; --accent: #2B55E0; --accent-soft: #E3EAFE;
  --up: #0B7F56; --up-soft: #DDF3EA; --down: #C0342B; --down-soft: #FBE4E1;
  --warn: #9A6408; --warn-soft: #FBEFD5;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D111D; --surface: #151A29; --sunken: #1C2234; --ink: #E7EBF4; --muted: #8E98AC;
    --line: #262D42; --accent: #86A2FF; --accent-soft: #1D2748;
    --up: #44D492; --up-soft: #12301F; --down: #FF7366; --down-soft: #3A1917;
    --warn: #F0B54A; --warn-soft: #33270F;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 12px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
.status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); text-align: right; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.live { background: var(--up); box-shadow: 0 0 0 4px var(--up-soft); }
.dot.late { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-soft); }
.dot.dead { background: var(--down); box-shadow: 0 0 0 4px var(--down-soft); }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 13px; text-decoration: underline; }

main { padding-block: 16px calc(88px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.row > * { min-width: 0; }
.big { font-size: 28px; font-weight: 650; line-height: 1.1; }
.mid { font-size: 18px; font-weight: 600; }
.small { font-size: 13px; }
.banner { border-radius: 12px; padding: 12px 14px; font-size: 14px; border: 1px solid transparent; }
.banner.bad { background: var(--down-soft); color: var(--down); border-color: var(--down); }
.banner.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.banner.info { background: var(--accent-soft); color: var(--accent); }
.banner.quiet { background: var(--sunken); color: var(--muted); }
.banner strong { display: block; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; background: var(--sunken); color: var(--muted); white-space: nowrap; }
.pill.up { background: var(--up-soft); color: var(--up); }
.pill.down { background: var(--down-soft); color: var(--down); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { border-radius: 10px; padding: 7px 2px; text-align: center; background: var(--sunken); font-size: 11px; color: var(--muted); line-height: 1.3; }
.day b { display: block; font-size: 14px; color: var(--ink); font-weight: 600; }
.day.open { background: var(--up-soft); } .day.open span { color: var(--up); }
.day.fed { background: var(--warn-soft); } .day.fed span { color: var(--warn); }
.day.today { outline: 2px solid var(--accent); outline-offset: -2px; }

/* noise gauge: sell zone | noise area | buy zone */
.gauge { position: relative; height: 34px; border-radius: 9px; overflow: hidden; display: grid; grid-template-columns: 1fr 2fr 1fr; background: var(--sunken); }
.gauge .z-sell { background: var(--down-soft); border-right: 2px solid var(--down); }
.gauge .z-buy { background: var(--up-soft); border-left: 2px solid var(--up); }
.gauge .z-mid { display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.gauge .mark { position: absolute; top: 3px; bottom: 3px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.gauge .vw { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dotted var(--accent); }
.glabels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; color: var(--muted); }
.glabels > div:last-child { text-align: right; }
.glabels .num { display: block; font-size: 15px; color: var(--ink); font-weight: 600; }
.verdict { font-size: 14px; }
.checks { width: 100%; border-collapse: collapse; font-size: 13px; }
.checks th { text-align: right; font-weight: 500; color: var(--muted); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; padding: 0 0 6px; }
.checks th:first-child, .checks td:first-child { text-align: left; }
.checks td { text-align: right; padding: 6px 0; border-top: 1px solid var(--line); }
.checks tr.past td { color: var(--muted); }
.checks tr.next td { font-weight: 650; }
.checks tr.next td:first-child::after { content: "next"; margin-left: 8px; font: 600 10px var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 7px; }
details.more summary { font-size: 13px; color: var(--muted); list-style: none; cursor: pointer; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "show"; margin-left: 8px; color: var(--accent); text-decoration: underline; }
details.more[open] summary::after { content: "hide"; }
details.more[open] summary { margin-bottom: 10px; }

/* meters */
.meter { height: 10px; border-radius: 6px; background: var(--sunken); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 6px; background: var(--accent); }
.meter.up i { background: var(--up); } .meter.down i { background: var(--down); } .meter.warn i { background: var(--warn); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { background: var(--sunken); border-radius: 10px; padding: 10px; min-width: 0; }
.tile span { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.tile b { display: block; font-size: 17px; font-weight: 650; margin-top: 2px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: right; font-weight: 500; color: var(--muted); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; padding-bottom: 6px; }
.tbl td { text-align: right; padding: 6px 0; border-top: 1px solid var(--line); }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
svg.chart { width: 100%; height: auto; display: block; }

/* trades */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tlist { display: flex; flex-direction: column; }
.trade { border-top: 1px solid var(--line); }
.trade:first-child { border-top: 0; }
.trade > button { width: 100%; background: none; border: 0; padding: 12px 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left; }
.trade .t1 { font-weight: 600; } .trade .t2 { font-size: 12px; color: var(--muted); }
.trade .r { text-align: right; font-weight: 650; } .trade .eur { text-align: right; font-size: 12px; }
.trade .body { padding: 0 0 14px; display: flex; flex-direction: column; gap: 10px; }
.trade textarea { width: 100%; min-height: 64px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 10px; resize: vertical; }
.btn { border: 0; border-radius: 10px; background: var(--accent); color: var(--surface); font-weight: 600; padding: 10px 16px; }
.btn.ghost { background: var(--sunken); color: var(--ink); }
.hasnote { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }

/* tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { background: none; border: 0; padding: 13px 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); border-top: 2px solid transparent; margin-top: -1px; }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-top-color: var(--accent); }

/* login */
.login { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.login h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
.login label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.login input { border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 12px; font-size: 16px; }
.err { color: var(--down); font-size: 14px; min-height: 20px; }
@media (prefers-reduced-motion: no-preference) { .meter i, .gauge .mark { transition: all 0.4s ease; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">NoiseBreakout</div>
    <div class="status" id="status" hidden><span class="dot" id="dot"></span><span id="statusText"></span></div>
  </div>
</header>

<div class="wrap">
  <section class="login" id="viewSetup" hidden>
    <h1>Not connected yet</h1>
    <p class="muted">This page has no database address. Add the Supabase URL and publishable key at the top of the script in index.html.</p>
  </section>

  <form class="login" id="viewLogin" hidden autocomplete="on">
    <h1>Sign in</h1>
    <label for="email">Email<input id="email" type="email" name="email" autocomplete="username" inputmode="email" required></label>
    <label for="password">Password<input id="password" type="password" name="password" autocomplete="current-password" required></label>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn" id="loginBtn" type="submit">Sign in</button>
  </form>

  <main id="viewApp" hidden>
    <div id="alerts"></div>
    <div id="tabToday"></div>
    <div id="tabAccount" hidden></div>
    <div id="tabStats" hidden></div>
    <div id="tabTrades" hidden></div>
    <button class="linkbtn" id="signOut" type="button">Sign out</button>
  </main>
</div>

<nav class="tabs" id="tabs" hidden>
  <div class="wrap" role="tablist">
    <button role="tab" data-tab="Today" aria-selected="true">Today</button>
    <button role="tab" data-tab="Account" aria-selected="false">Account</button>
    <button role="tab" data-tab="Stats" aria-selected="false">Stats</button>
    <button role="tab" data-tab="Trades" aria-selected="false">Trades</button>
  </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- configuration
// Both values are public by design: the data is protected by the login and the database rules.
const SUPABASE_URL = "https://nehhbnokbdwdhndwmylb.supabase.co";
const SUPABASE_KEY = "sb_publishable_GQX7rFeDrPZQICB7h7Hh7g_-UBDhFO8";

// Backtest reference (MT5 Strategy Tester, FTMO data, 2022 to Nov 2026, 853 trades)
const BACKTEST = { win: 0.34, avgR: 0.25 };
// Risk per trade used by the bot, % of the account size: normal and reduced
const RISK_PCTS = [0.5, 0.25];

// ---------------------------------------------------------------- helpers
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const isNum = (v) => typeof v === "number" && isFinite(v);
const px = (v) => isNum(v) ? v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "n/a";
const pts = (v) => isNum(v) ? Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) : "n/a";
const pct = (v, d) => isNum(v) ? (v * 100).toFixed(d == null ? 1 : d) + "%" : "n/a";
const SIGN = (v) => v > 0 ? "+" : v < 0 ? "−" : "";
let CUR = "€";
const money = (v, signed) => isNum(v) ? (signed ? SIGN(v) : (v < 0 ? "−" : "")) + CUR + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "n/a";
const rr = (v) => isNum(v) ? SIGN(v) + Math.abs(v).toFixed(2) + "R" : "n/a";
const cls = (v) => v > 0 ? "up" : v < 0 ? "down" : "muted";
const hm = (ts) => new Date(ts * 1000).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const dmy = (ts) => new Date(ts * 1000).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const nyParts = (ts) => {
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "America/New_York", weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date(ts * 1000));
  const g = (t) => (p.find((x) => x.type === t) || {}).value;
  return { wd: g("weekday"), min: (Number(g("hour")) % 24) * 60 + Number(g("minute")) };
};
const NAMES = { "US500.cash": "S&P 500", "US100.cash": "Nasdaq 100", "US30.cash": "Dow Jones", "US2000.cash": "Russell 2000" };
const symName = (s) => NAMES[s] || s;
const CHECK_NY = ["10:30", "11:30", "12:30", "13:30", "14:30", "15:30"];
const ago = (sec) => sec < 90 ? Math.max(0, Math.round(sec)) + " s ago" : sec < 5400 ? Math.round(sec / 60) + " min ago" : sec < 172800 ? Math.round(sec / 3600) + " h ago" : Math.round(sec / 86400) + " days ago";
const until = (sec) => sec < 60 ? "in under a minute" : sec < 5400 ? "in " + Math.round(sec / 60) + " min" : "in " + (sec / 3600).toFixed(1) + " h";

// ---------------------------------------------------------------- state
let sb = null;
let S = null;            // latest snapshot payload
let SAt = 0;             // when the database received it (unix s)
let T = [];              // closed trades, newest first
let tab = "Today";
let filt = { res: "all", sym: "all" };
let openTrade = null;    // id of the expanded trade
let dirtyNote = false;
let fetchErr = "";
let tradesKey = "";
let timerPoll = null, timerTick = null;

// ---------------------------------------------------------------- data
async function loadState() {
  const { data, error } = await sb.from("nb_state").select("updated_at,payload").limit(1);
  if (error) throw error;
  if (data && data.length) {
    S = data[0].payload; SAt = Date.parse(data[0].updated_at) / 1000;
    if (S && S.currency && S.currency !== "EUR") CUR = S.currency + " ";
  }
}
async function loadTrades() {
  const { data, error } = await sb.from("nb_trades").select("*").order("exit_ts", { ascending: false }).limit(1000);
  if (error) throw error;
  T = (data || []).map((t) => Object.assign({}, t, { entry_s: Date.parse(t.entry_ts) / 1000, exit_s: Date.parse(t.exit_ts) / 1000, r_price: t.r }));
  applyPlannedRisk();
}
// The reporter sends R measured on prices (fill to initial stop). The bot defines R as the money result
// divided by the planned risk (0.5% of the account, or 0.25% when the risk is reduced). The two differ when
// the entry slips. Here each trade is matched to the planned risk it was sized with, and R is recomputed.
function applyPlannedRisk() {
  const size = S && S.cfg ? S.cfg.size : 10000;
  const levels = RISK_PCTS.map((p) => size * p / 100);
  const chron = T.slice().sort((a, b) => a.entry_s - b.entry_s);
  let last = levels[0];
  chron.forEach((t) => {
    if (isNum(t.pnl) && isNum(t.r_price) && Math.abs(t.r_price) >= 0.2) {
      const est = Math.abs(t.pnl / t.r_price);
      last = levels.reduce((best, l) => Math.abs(Math.log(l / est)) < Math.abs(Math.log(best / est)) ? l : best, levels[0]);
    }
    t.risk = last;
    if (isNum(t.pnl)) t.r = t.pnl / last;
  });
}
let lastTradesLoad = 0, lastClosed = -1;
async function refresh(forceTrades) {
  try {
    await loadState();
    const now = Date.now() / 1000;
    const n = S ? S.n_closed : -1;
    if (forceTrades || n !== lastClosed || now - lastTradesLoad > 300) {
      await loadTrades(); lastTradesLoad = now; lastClosed = n;
    }
    fetchErr = "";
  } catch (e) {
    fetchErr = (e && e.message) || "Could not reach the database";
  }
  render();
}

// ---------------------------------------------------------------- derived
function sessionNow() {            // is it NYSE cash session time right now, by this device's clock?
  const p = nyParts(Date.now() / 1000);
  return p.wd !== "Sat" && p.wd !== "Sun" && p.min >= 570 && p.min < 960;
}
function targetEquity() {
  const c = S.cfg; return c.target_pct > 0 ? c.size * (1 + c.target_pct / 100) + c.target_margin : null;
}
function stats(list) {
  const rs = list.filter((t) => isNum(t.r));
  const o = { n: list.length, nr: rs.length, wins: 0, sumR: 0, pos: 0, neg: 0, nW: 0, nL: 0, best: null, worst: null, streak: 0, dd: 0, eur: 0, curve: [] };
  list.forEach((t) => { if (isNum(t.pnl)) { o.eur += t.pnl; if (t.pnl > 0) o.wins++; } });
  const chron = rs.slice().sort((a, b) => a.exit_s - b.exit_s);
  let cum = 0, peak = 0, run = 0;
  chron.forEach((t) => {
    cum += t.r; o.sumR += t.r; o.curve.push(cum);
    if (t.r > 0) { o.pos += t.r; o.nW++; run = 0; } else { o.neg += t.r; o.nL++; run++; if (run > o.streak) o.streak = run; }
    if (cum > peak) peak = cum; if (peak - cum > o.dd) o.dd = peak - cum;
    if (o.best == null || t.r > o.best) o.best = t.r; if (o.worst == null || t.r < o.worst) o.worst = t.r;
  });
  o.avgR = o.nr ? o.sumR / o.nr : null;
  o.win = o.n ? o.wins / o.n : null;
  o.pf = o.neg < 0 ? o.pos / -o.neg : null;
  o.avgW = o.nW ? o.pos / o.nW : null; o.avgL = o.nL ? o.neg / o.nL : null;
  return o;
}
function exitLabel(t) {
  if (t.reason === "stop") return "Stop loss";
  if (t.reason === "manual") return "Closed by hand";
  if (t.reason === "stopout") return "Stop out";
  const m = nyParts(t.exit_s).min;
  if (m >= 958) return "End of day";
  if (m % 60 >= 30 && m % 60 <= 33) return "Trailing exit";
  return "Profit cap or target";
}

// ---------------------------------------------------------------- render: header and alerts
function renderHeader() {
  const st = $("status"), dot = $("dot"), txt = $("statusText");
  st.hidden = false;
  if (!S) { dot.className = "dot"; txt.textContent = "No data yet"; return; }
  const age = Date.now() / 1000 - SAt;
  if (age < 150) { dot.className = "dot live"; txt.textContent = "Live, updated " + ago(age); }
  else if (age < 300) { dot.className = "dot late"; txt.textContent = "Delayed, updated " + ago(age); }
  else { dot.className = "dot " + (sessionNow() ? "dead" : ""); txt.textContent = "MT5 offline, last update " + ago(age); }
}
function renderAlerts() {
  const a = [];
  if (fetchErr) a.push('<div class="banner warn"><strong>Could not refresh</strong>' + esc(fetchErr) + "</div>");
  if (S) {
    const age = Date.now() / 1000 - SAt;
    if (age >= 300 && sessionNow()) a.push('<div class="banner bad"><strong>MT5 is not reporting during the session</strong>Last update at ' + hm(SAt) + " (" + ago(age) + "). Check that the Mac is awake and MT5 is open.</div>");
    else if (age >= 300) a.push('<div class="banner quiet">MT5 is offline. Showing the last data received, from ' + dmy(SAt) + " at " + hm(SAt) + ".</div>");
    if (age < 300 && S.connected === false) a.push('<div class="banner bad"><strong>MT5 has no connection to the broker</strong>The bot cannot trade until it reconnects.</div>');
    if (age < 300 && S.algo_enabled === false) a.push('<div class="banner bad"><strong>Algo Trading is switched off in MT5</strong>The bot cannot open or close trades.</div>');
    if (S.target_locked) a.push('<div class="banner info"><strong>Challenge target reached</strong>The bot closed everything and stopped for good.</div>');
    if (S.killed) a.push('<div class="banner bad"><strong>Kill switch active</strong>The bot stopped opening trades.</div>');
  }
  $("alerts").innerHTML = a.length ? '<div style="display:flex;flex-direction:column;gap:10px">' + a.join("") + "</div>" : "";
  $("alerts").hidden = !a.length;
}

// ---------------------------------------------------------------- render: today
function phaseLine(now) {
  const st = S.day_state, c = S.checks, first = S.first_check;
  const next = (S.week || []).slice(1).find((d) => d.state === "open");
  const nextTxt = next ? " Next session: " + new Date(next.date.replace(/\./g, "-") + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short", timeZone: "UTC" }) + "." : "";
  if (st === "weekend") return ["Weekend", "The market is closed." + nextTxt, ""];
  if (st === "holiday") return ["Holiday", "NYSE holiday: the bot does not trade today." + nextTxt, ""];
  if (st === "early_close") return ["Early close", "Short NYSE session: the bot does not trade today." + nextTxt, ""];
  if (st === "fed") return ["Fed day", (S.day_reason ? esc(S.day_reason) + ": " : "") + "the bot does not trade today." + nextTxt, "warn"];
  const open = c[0] - 3600;
  if (now < open) return ["Before the open", "Session opens at " + hm(open) + ". First check at " + hm(c[first]) + ".", "accent"];
  for (let b = first; b < c.length; b++) if (now < c[b]) return ["Session open", "Next check at " + hm(c[b]) + ", " + until(c[b] - now) + ".", "up"];
  if (now < S.exit_ts) return ["Session open", "No more entries today. Open positions close at " + hm(S.exit_ts) + ".", "up"];
  return ["Session finished", "All checks are done for today." + nextTxt, ""];
}
function symCard(s, now) {
  const c = S.checks, first = S.first_check, mult = S.cfg.mult;
  let nb = -1;
  for (let b = first; b < c.length; b++) if (now < c[b]) { nb = b; break; }
  const tradable = S.day_state === "open";
  const preview = S.day_state !== "open" && S.day_state !== "fed";   // weekend or holiday: no session today
  const fb = preview ? first : nb >= 0 ? nb : c.length - 1;        // band shown on the gauge
  let h = '<div class="card"><div class="row"><div><div class="mid">' + esc(symName(s.sym)) + '</div><div class="small muted">' + esc(s.sym) + "</div></div>";
  h += '<div style="text-align:right"><div class="mid num">' + px(s.price) + "</div>";
  if (isNum(s.open) && isNum(s.price)) { const ch = s.price / s.open - 1; h += '<div class="small num ' + cls(ch) + '">' + SIGN(ch) + pct(Math.abs(ch), 2) + " from the open</div>"; }
  h += "</div></div>";

  if (!s.ready) { h += '<div class="banner warn">Not enough price history in MT5 to compute the bands yet.</div></div>'; return h; }

  // provisional bands before the 09:30 open: use the current price as the open
  const prov = !s.bands;
  const ref = prov ? s.price : s.open;
  const ub = [], lb = [];
  for (let b = 0; b < 6; b++) {
    if (!prov) { ub[b] = s.ub[b]; lb[b] = s.lb[b]; }
    else { ub[b] = Math.max(ref, s.prev_close) * (1 + s.sig[b] * mult); lb[b] = Math.min(ref, s.prev_close) * (1 - s.sig[b] * mult); }
  }
  const U = ub[fb], L = lb[fb], P = s.price, W = U - L;
  const pos = Math.max(1.5, Math.min(98.5, 25 + ((P - L) / W) * 50));
  const vw = isNum(s.vwap) ? 25 + ((s.vwap - L) / W) * 50 : null;
  h += '<div class="gauge" role="img" aria-label="Price position between the sell band and the buy band"><div class="z-sell"></div><div class="z-mid">noise area</div><div class="z-buy"></div>';
  if (vw != null && vw > 0 && vw < 100) h += '<div class="vw" style="left:' + vw.toFixed(1) + '%"></div>';
  h += '<div class="mark" style="left:' + pos.toFixed(1) + '%"></div></div>';
  h += '<div class="glabels"><div>Sells below<span class="num">' + px(L) + '</span></div><div>Buys above<span class="num">' + px(U) + "</span></div></div>";

  // verdict
  let v = "";
  const at = nb >= 0 ? hm(c[nb]) : "";
  if (s.pos) {
    const p = s.pos, risk = isNum(p.sl0) ? Math.max(Math.abs(p.entry - p.sl0), 0.001 * p.entry) : null;
    const liveR = risk ? p.dir * (P - p.entry) / risk : null;
    v = '<span class="pill ' + (p.dir > 0 ? "up" : "down") + '">' + (p.dir > 0 ? "LONG" : "SHORT") + " open</span> " +
        '<span class="num">' + px(p.lots) + "</span> lots at <span class=\"num\">" + px(p.entry) + "</span>, stop <span class=\"num\">" + px(p.sl) + "</span>. " +
        'Now <b class="num ' + cls(p.pnl) + '">' + money(p.pnl, true) + (liveR != null ? " (" + rr(liveR) + ")" : "") + "</b>.";
  } else if (preview) {
    v = '<span class="muted">Preview of the first check of the next session, if it opened at the current price.</span>';
  } else if (!tradable) {
    v = '<span class="muted">Shown for reference only: the bot does not trade today.</span>';
  } else if (s.traded_today) {
    v = '<span class="pill">Done</span> Already traded today. One trade per symbol per day.';
  } else if (nb < 0) {
    v = '<span class="muted">No more checks today.</span>';
  } else if (P > U) {
    const sl = isNum(s.vwap) ? Math.max(U, s.vwap) : U;
    v = '<span class="pill up">Would BUY</span> Price is <span class="num">' + pts(P - U) + "</span> pts above the buy band. If it stays there at " + at + ", the bot buys, with the stop near <span class=\"num\">" + px(sl) + "</span>.";
  } else if (P < L) {
    const sl = isNum(s.vwap) ? Math.min(L, s.vwap) : L;
    v = '<span class="pill down">Would SELL</span> Price is <span class="num">' + pts(L - P) + "</span> pts below the sell band. If it stays there at " + at + ", the bot sells, with the stop near <span class=\"num\">" + px(sl) + "</span>.";
  } else {
    v = '<span class="pill">No entry</span> Inside the noise area. To trade at ' + at + ' it needs <span class="num">+' + pts(U - P) + "</span> pts (" + pct((U - P) / P, 2) + ') to buy or <span class="num">−' + pts(P - L) + "</span> pts (" + pct((P - L) / P, 2) + ") to sell.";
  }
  h += '<div class="verdict">' + v + "</div>";
  if (prov) h += '<div class="small muted">Provisional: the real bands are fixed at the ' + hm(c[0] - 3600) + " open" + (preview ? " of that session" : "") + ".</div>";

  // check table
  h += '<details class="more"' + (tradable && nb >= 0 ? " open" : "") + '><summary>All checks today</summary><table class="checks"><thead><tr><th>Check</th><th>Sells below</th><th>Buys above</th></tr></thead><tbody>';
  for (let b = first; b < c.length; b++) {
    h += '<tr class="' + (b === nb ? "next" : now >= c[b] ? "past" : "") + '"><td class="num">' + hm(c[b]) + '</td><td class="num">' + px(lb[b]) + '</td><td class="num">' + px(ub[b]) + "</td></tr>";
  }
  h += '</tbody></table><div class="small muted" style="margin-top:8px">Open <span class="num">' + px(s.open) + '</span>, previous close <span class="num">' + px(s.prev_close) + '</span>, VWAP <span class="num">' + px(s.vwap) + "</span> (dotted line).</div></details></div>";
  return h;
}
function renderToday() {
  const el = $("tabToday");
  if (!S) { el.innerHTML = '<div class="card"><h2>Today</h2><div>Waiting for the first update from MT5. Start the NB Reporter on a chart and this page fills in within a minute.</div></div>'; return; }
  const now = Date.now() / 1000;
  const ph = phaseLine(now);
  const dayPnl = S.equity - S.day_start;
  let h = '<div class="card"><div class="row"><h2>Today</h2><span class="pill ' + ph[2] + '">' + ph[0] + "</span></div><div>" + ph[1] + "</div>";
  h += '<div class="row"><span class="muted">Day result</span><b class="num ' + cls(dayPnl) + '">' + money(dayPnl, true) + "</b></div>";
  const cap = S.cfg.daily_cap_pct / 100 * S.cfg.size, stop = S.cfg.daily_stop_pct / 100 * S.cfg.size;
  if (S.cfg.daily_cap_pct > 0 && dayPnl >= cap) h += '<div class="banner info">Daily profit cap reached: the bot closes everything and stops for today.</div>';
  else if (dayPnl <= -stop) h += '<div class="banner warn">Daily loss stop reached (' + money(-stop) + "): no new entries today.</div>";
  if (S.week && S.week.length) {
    h += '<div class="week">';
    S.week.forEach((d, i) => {
      const dt = new Date(d.date.replace(/\./g, "-") + "T12:00:00Z");
      const lab = d.state === "open" ? "trades" : d.state === "fed" ? "Fed" : d.state === "weekend" ? "closed" : d.state === "holiday" ? "holiday" : "short";
      h += '<div class="day ' + esc(d.state) + (i === 0 ? " today" : "") + '" title="' + esc(d.reason || "") + '">' + dt.toLocaleDateString("en-GB", { weekday: "short", timeZone: "UTC" }) + "<b>" + dt.getUTCDate() + "</b><span>" + lab + "</span></div>";
    });
    h += "</div>";
  }
  h += "</div>";
  (S.symbols || []).forEach((s) => { h += symCard(s, now); });
  // keep <details> open state across refreshes
  const openState = Array.from(el.querySelectorAll("details.more")).map((d) => d.open);
  el.innerHTML = '<div style="display:flex;flex-direction:column;gap:14px">' + h + "</div>";
  if (openState.length) el.querySelectorAll("details.more").forEach((d, i) => { if (i < openState.length) d.open = openState[i]; });
}

function meter(frac, kind) { return '<div class="meter ' + (kind || "") + '"><i style="width:' + (Math.max(0, Math.min(1, frac)) * 100).toFixed(1) + '%"></i></div>'; }

  const dFloor = S.day_start - c.max_daily_loss_pct / 100 * c.size, dRoom = S.equity - dFloor, dMax = c.max_daily_loss_pct / 100 * c.size;

  h += '<div class="small muted">Account fails today below <span class="num">' + money(dFloor) + "</span>. The bot stops entering after a day loss of " + money(c.daily_stop_pct / 100 * c.size) + ".</div>";

  h += '<div class="small muted">Account fails below <span class="num">' + money(mFloor) + "</span> (highest end of day balance minus " + c.max_loss_pct + "%).</div>";

  el.innerHTML = '<div style="display:flex;flex-direction:column;gap:14px">' + h + "</div>";

// ---------------------------------------------------------------- render: stats
function chart(curve) {
  if (curve.length < 2) return "";
  const W = 320, H = 130, L = 42, R = 10, Tp = 12, B = 18;
  const ys = [0].concat(curve), lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys), span = (hi - lo) || 1;
  const X = (i) => L + (i / (ys.length - 1)) * (W - L - R), Y = (v) => Tp + (1 - (v - lo) / span) * (H - Tp - B);
  const d = ys.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join(" ");
  const last = ys[ys.length - 1], col = last >= 0 ? "var(--up)" : "var(--down)";
  let s = '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Cumulative result in R, trade by trade">';
  s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>';
  s += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  s += '<circle cx="' + X(ys.length - 1).toFixed(1) + '" cy="' + Y(last).toFixed(1) + '" r="3.5" fill="' + col + '"/>';
  const lab = (v, y) => '<text x="' + (L - 6) + '" y="' + y + '" text-anchor="end" font-size="10" fill="var(--muted)" font-family="ui-monospace, Menlo, monospace">' + SIGN(v) + Math.abs(v).toFixed(1) + "R</text>";
  s += lab(hi, (Y(hi) + 3).toFixed(1));
  if (lo < hi) s += lab(lo, (Y(lo) + 3).toFixed(1));
  s += '<text x="' + L + '" y="' + (H - 4) + '" font-size="10" fill="var(--muted)">first trade</text><text x="' + (W - R) + '" y="' + (H - 4) + '" text-anchor="end" font-size="10" fill="var(--muted)">latest</text></svg>';
  return s;
}
function splitRows(groups) {
  return groups.map((g) => { const o = stats(g[1]); return o.n ? "<tr><td>" + esc(g[0]) + '</td><td class="num">' + o.n + '</td><td class="num">' + pct(o.win, 0) + '</td><td class="num ' + cls(o.avgR) + '">' + rr(o.avgR) + '</td><td class="num ' + cls(o.sumR) + '">' + rr(o.sumR) + "</td></tr>" : ""; }).join("");
}
function renderStats() {
  const el = $("tabStats");

}

// ---------------------------------------------------------------- events
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });
$("tabTrades").addEventListener("input", (e) => { if (e.target.tagName === "TEXTAREA") dirtyNote = true; });
$("tabTrades").addEventListener("click", async (e) => {
  const f = e.target.closest("button[data-f]"), tr = e.target.closest("button[data-trade]"), sv = e.target.closest("button[data-save]");
  if (f) { filt[f.dataset.f] = f.dataset.v; dirtyNote = false; renderTrades(); }
  else if (tr) { const id = Number(tr.dataset.trade); openTrade = openTrade === id ? null : id; dirtyNote = false; renderTrades(); }
  else if (sv) {
    const id = Number(sv.dataset.save), ta = $("note" + id), msg = $("noteMsg" + id), note = ta.value.trim();
    sv.disabled = true; msg.textContent = "Saving";
    const { error } = await sb.from("nb_trades").update({ note: note, note_updated_at: new Date().toISOString() }).eq("id", id);
    sv.disabled = false;
    if (error) { msg.textContent = "Not saved: " + error.message; return; }
    const t = T.find((x) => x.id === id); if (t) t.note = note;
    dirtyNote = false; tradesKey = ""; render();
    const m2 = $("noteMsg" + id); if (m2) m2.textContent = "Saved";
  }
});
$("viewLogin").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginErr").textContent = ""; $("loginBtn").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  $("loginBtn").disabled = false;
  if (error) $("loginErr").textContent = error.message === "Invalid login credentials" ? "Wrong email or password." : error.message;
});
$("signOut").addEventListener("click", () => sb.auth.signOut());
document.addEventListener("visibilitychange", () => { if (!document.hidden && timerPoll) refresh(false); });

// ---------------------------------------------------------------- start
function setView(v) {
  $("viewSetup").hidden = v !== "setup"; $("viewLogin").hidden = v !== "login"; $("viewApp").hidden = v !== "app"; $("tabs").hidden = v !== "app";
  if (v !== "app") $("status").hidden = true;
}
function startApp() {
  setView("app");
  let saved = null; try { saved = localStorage.getItem("nb_tab"); } catch (e) {}
  showTab(["Today", "Account", "Stats", "Trades"].indexOf(saved) >= 0 ? saved : "Today");
  refresh(true);
  clearInterval(timerPoll); clearInterval(timerTick);
  timerPoll = setInterval(() => { if (!document.hidden) refresh(false); }, 15000);
  timerTick = setInterval(() => { if (!document.hidden && S) { renderHeader(); renderAlerts(); renderToday(); } }, 5000);
}
function stopApp() {
  clearInterval(timerPoll); clearInterval(timerTick); timerPoll = timerTick = null;
  S = null; T = []; tradesKey = ""; lastClosed = -1;
  setView("login");
}
(function init() {
  if (!SUPABASE_URL || !SUPABASE_KEY || !window.supabase) { setView("setup"); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let running = false;
  sb.auth.onAuthStateChange((event, session) => {
    if (session && !running) { running = true; startApp(); }
    else if (!session && (event === "SIGNED_OUT" || event === "INITIAL_SESSION")) { running = false; stopApp(); }
  });
})();
</script>
</body>
</html>
